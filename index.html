<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Myntra</title>
</head>

<body>
    <header>

        <div class="logo">
            <a href="#"><img src="myntra_logo.webp" class="logo"></a>
        </div>
        <div class="action-bar">
            <div><a href="#">men</a></div>
            <div><a href="#">women</a></div>
            <div><a href="#">beauty</a></div>
            <div><a href="#">kids</a></div>
            <div><a href="#">genz</a></div>
            <div><a href="#">studio<sup>NEW</sup></a></div>
        </div>

        <div class="search-container">
            <div class="search-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="search-input">
                <input type="text" placeholder="search for products and other things" class="input">
            </div>
        </div>
        <div class="extra-icons">
            <div class="profile">
                <i class="fa-regular fa-user profile-icon"></i>
                <p class="profile-para">Profile</p>
            </div>
            <div class="wishlist">
                <i class="fa-regular fa-heart wishlist-icon"></i>
                <p class="wish-para">Wishlist</p>
            </div>
            <div class="bag">
                <i class="fa-solid fa-bag-shopping"></i>
                <p class="bag-para">Bag</p>


            </div>
        </div>
    </header>
    <main>
        <div class="banner-container">
            <a href="#"><img src="banner.jpg" class="ban-img"></a>
        </div>
        <div class="head1">
            Shop By Category
        </div>
        <div class="catagory">

            <a href="#"><img src="img1/4.png" class="items"></a>

            <a href="#"><img src="img1/6.png" class="items"></a>
            <a href="#"><img src="img1/7.png" class="items"></a>
            <a href="#"><img src="img1/8.png" class="items"></a>
            <a href="#"><img src="img1/3.png" class="items"></a>
            <a href="#"><img src="img1/1.png" class="items"></a>
            <a href="#"><img src="img1/7.png" class="items"></a>
